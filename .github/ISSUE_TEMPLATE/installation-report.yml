name: Installation and first-project report
description: Tell us whether your first PHPAML project succeeded or failed.
title: "[Install]: "
labels:
  - installation
body:
  - type: markdown
    attributes:
      value: |
        Every result is useful, including a successful installation. These reports help improve PHPAML without hidden telemetry. Never include secrets or an unredacted `.env` file.
  - type: dropdown
    id: outcome
    attributes:
      label: Outcome
      description: How far did you get?
      options:
        - Installation and first project succeeded
        - Installation succeeded, but project creation failed
        - Project was created, but diagnostics failed
        - Diagnostics passed, but the application did not start
        - Installation failed
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Windows 11 x64
        - Windows 10 x64
        - macOS ARM64
        - Ubuntu x64
        - Debian x64
        - Other Linux x64
        - Other
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: System version
      placeholder: "Example: macOS 15.6 or Ubuntu 24.04"
    validations:
      required: true
  - type: input
    id: cli-version
    attributes:
      label: PHPAML CLI version
      description: Run `aml version` when possible.
      placeholder: "Example: 1.7.0-beta.14"
    validations:
      required: true
  - type: dropdown
    id: project-type
    attributes:
      label: Project type
      options:
        - Classic MVC application (`aml create`)
        - AML View application (`aml create-view-app`)
        - JSON API (`aml create-api`)
    validations:
      required: true
  - type: textarea
    id: commands
    attributes:
      label: Commands run
      description: List the commands in order, without secrets.
      render: shell
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Result
      description: Describe what worked, what failed, and what you expected.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Sanitized `aml doctor` output
      description: Remove private paths, URLs, tokens, and credentials. Write "Unavailable" if the command could not run.
      render: text
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, tokens, personal data, and other secrets from this report.
          required: true

