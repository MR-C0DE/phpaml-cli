name: Test AML CLI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  doctor:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        if: runner.os != 'Windows'
        with:
          repository: MR-C0DE/phpaml-framework
          path: .integration/framework
      - uses: actions/checkout@v5
        if: runner.os != 'Windows'
        with:
          repository: MR-C0DE/phpaml-data
          path: .integration/data
      - uses: actions/checkout@v5
        if: runner.os != 'Windows'
        with:
          repository: MR-C0DE/phpaml-engine
          path: .integration/engine
      - uses: actions/checkout@v5
        if: runner.os != 'Windows'
        with:
          repository: MR-C0DE/phpaml-view
          path: .integration/view
      - uses: actions/checkout@v5
        if: runner.os != 'Windows'
        with:
          repository: MR-C0DE/phpaml-i18n
          path: .integration/i18n
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, pdo, pdo_sqlite
      - name: Validate PHP sources
        shell: bash
        run: find cli tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Protect package architecture boundaries
        if: runner.os != 'Windows'
        shell: bash
        env:
          PHPAML_PACKAGES_ROOT: ${{ github.workspace }}/.integration/packages
        run: |
          mkdir -p "$PHPAML_PACKAGES_ROOT"
          ln -s "$GITHUB_WORKSPACE/.integration/framework" "$PHPAML_PACKAGES_ROOT/phpaml-framework"
          ln -s "$GITHUB_WORKSPACE/.integration/engine" "$PHPAML_PACKAGES_ROOT/phpaml-engine"
          ln -s "$GITHUB_WORKSPACE/.integration/view" "$PHPAML_PACKAGES_ROOT/phpaml-view"
          ln -s "$GITHUB_WORKSPACE/.integration/data" "$PHPAML_PACKAGES_ROOT/phpaml-data"
          ln -s "$GITHUB_WORKSPACE/.integration/i18n" "$PHPAML_PACKAGES_ROOT/phpaml-i18n"
          php ./tests/architecture-boundaries.php
      - name: Test PHP runtime selection
        shell: bash
        run: php ./tests/php-runtime-smoke.php
      - name: Test aml doctor on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: ./tests/doctor-smoke.sh
      - name: Test SEO commands on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: ./tests/seo-smoke.sh
      - name: Test AI debugger configuration on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: ./tests/ai-debug-smoke.sh
      - name: Test build and deployment configuration on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: ./tests/build-deploy-smoke.sh
      - name: Test Data installation and command routing on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: PHP_BINARY=php ./tests/data-smoke.sh
      - name: Test API installation and generator on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: PHP_BINARY=php ./tests/api-smoke.sh
      - name: Test modern API and Data CRUD integration on Unix
        if: runner.os != 'Windows'
        shell: bash
        env:
          PHPAML_FRAMEWORK_SOURCE: ${{ github.workspace }}/.integration/framework/src
          PHPAML_DATA_SOURCE: ${{ github.workspace }}/.integration/data/src
        run: php ./tests/modern-api-crud.php
      - name: Test AML View installation and generators on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: PHP_BINARY=php ./tests/view-smoke.sh
      - name: Test bilingual CLI on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p .test-runtime/runtime/bin
          cp cli/aml.php .test-runtime/runtime/bin/aml.php
          cp cli/ai-debug.php .test-runtime/runtime/bin/ai-debug.php
          cp cli/deploy.php .test-runtime/runtime/bin/deploy.php
          cp phpaml.json .test-runtime/phpaml.json
          AML_LANG=en php .test-runtime/runtime/bin/aml.php help | grep -q "Usage: aml <command>"
          AML_LANG=fr php .test-runtime/runtime/bin/aml.php help | grep -q "Utilisation : aml <commande>"
          EXPECTED_VERSION=$(php -r '$i=json_decode(file_get_contents("phpaml.json"), true); echo $i["version"];')
          AML_LANG=en php .test-runtime/runtime/bin/aml.php version | grep -q "$EXPECTED_VERSION"
          AML_LANG=en php .test-runtime/runtime/bin/aml.php help | grep -q -- "--update \[options\]"
      - name: Test documentation
        shell: bash
        run: php ./tests/docs-smoke.php
