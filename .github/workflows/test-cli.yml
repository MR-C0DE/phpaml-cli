name: Test AML CLI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  doctor:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, pdo, pdo_sqlite
      - name: Validate PHP sources
        shell: bash
        run: find cli tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Test aml doctor on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: ./tests/doctor-smoke.sh
      - name: Test bilingual CLI on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p .test-runtime/aml_env/bin
          cp cli/aml.php .test-runtime/aml_env/bin/aml.php
          cp info.json .test-runtime/info.json
          AML_LANG=en php .test-runtime/aml_env/bin/aml.php help | grep -q "Usage: aml <command>"
          AML_LANG=fr php .test-runtime/aml_env/bin/aml.php help | grep -q "Utilisation : aml <commande>"
          EXPECTED_VERSION=$(php -r '$i=json_decode(file_get_contents("info.json"), true); echo $i["version"];')
          AML_LANG=en php .test-runtime/aml_env/bin/aml.php version | grep -q "$EXPECTED_VERSION"
      - name: Test documentation
        shell: bash
        run: php ./tests/docs-smoke.php
