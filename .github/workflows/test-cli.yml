name: Test AML CLI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  doctor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test aml doctor
        run: ./tests/doctor-smoke.sh
      - name: Test documentation
        run: php ./tests/docs-smoke.php
