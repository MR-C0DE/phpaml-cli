name: Build Windows x64

on:
  workflow_dispatch:
  workflow_call:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build autonomous AML installer
        shell: pwsh
        run: ./scripts/build-windows-x64.ps1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Test console after Windows installation
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem 'dist/phpaml-*-windows-x64.exe')
          if ($installers.Count -ne 1) { throw 'Expected one Windows installer.' }
          $destination = Join-Path $env:RUNNER_TEMP ('console install-' + [guid]::NewGuid().ToString('N'))
          $arguments = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/NOICONS', '/NOCLOSEAPPLICATIONS', '/NORESTARTAPPLICATIONS', '/LANG=english', ('/DIR="{0}"' -f $destination))
          try {
            $setup = Start-Process -FilePath $installers[0].FullName -ArgumentList $arguments -Wait -PassThru
            if ($setup.ExitCode -ne 0) { throw "Installer failed: $($setup.ExitCode)" }
            $php = Join-Path $destination 'runtime/php/php.exe'
            $launcher = Join-Path $destination 'bin/aml.exe'
            & $launcher version
            if ($LASTEXITCODE -ne 0) { throw 'Installed launcher failed.' }
            & $php tests/package-integrity.php $destination
            if ($LASTEXITCODE -ne 0) { throw 'Installed package integrity failed.' }
            & $php tests/console-package.php $destination $launcher
            if ($LASTEXITCODE -ne 0) { throw 'Installed console validation failed.' }
          } finally {
            $uninstaller = Join-Path $destination 'unins000.exe'
            if (Test-Path $uninstaller) {
              $removed = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
              if ($removed.ExitCode -ne 0) { throw "Uninstaller failed: $($removed.ExitCode)" }
            }
          }
          if (Test-Path (Join-Path $destination 'bin/aml.exe')) { throw 'The test installation was not removed.' }
      - name: Verify checksums and extracted portable archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($checksum in Get-ChildItem 'dist/*.sha256') {
            $line = (Get-Content $checksum.FullName -Raw).Trim()
            if ($line -notmatch '^([a-fA-F0-9]{64})\s+(.+)$') { throw "Invalid checksum file: $checksum" }
            $expected = $Matches[1].ToLowerInvariant()
            $archive = Join-Path $checksum.DirectoryName $Matches[2]
            if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw "Checksum mismatch: $archive" }
          }
          $extracted = Join-Path $env:RUNNER_TEMP ('aml portable-' + [guid]::NewGuid().ToString('N'))
          try {
            Expand-Archive 'dist/aml-windows-x64.zip' -DestinationPath $extracted
            $php = Join-Path $extracted 'runtime/php/php.exe'
            & (Join-Path $extracted 'bin/aml.exe') version
            if ($LASTEXITCODE -ne 0) { throw 'Extracted launcher failed.' }
            & $php tests/package-integrity.php $extracted
            if ($LASTEXITCODE -ne 0) { throw 'Extracted package integrity failed.' }
            & $php tests/console-package.php $extracted
            if ($LASTEXITCODE -ne 0) { throw 'Extracted console validation failed.' }
          } finally {
            if (Test-Path $extracted) { Remove-Item -Recurse -Force $extracted }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: aml-windows-x64
          path: |
            dist/aml-windows-x64.zip
            dist/aml-windows-x64.zip.sha256
            dist/phpaml-*-windows-x64.exe
            dist/phpaml-*-windows-x64.exe.sha256
