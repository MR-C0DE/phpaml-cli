name: Publish CLI release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact existing version tag to publish (for example v1.7.0-beta.45)
        type: string
        required: true

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-cli-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test publication guards
        run: python3 tests/release-workflow-test.py
      - name: Verify the requested tag and its platform artifacts
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/prepare-release.py "$RELEASE_TAG"
      - name: Independently verify Apple signatures and notarization
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          SOURCE_COMMIT: ${{ steps.release.outputs.sha }}
        run: |
          python3 scripts/macos-signing.py verify --directory release-assets \
            --version "$RELEASE_VERSION" --commit "$SOURCE_COMMIT"
      - name: Publish the verified version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "This release already exists; its assets will not be overwritten." >&2
            exit 1
          fi
          args=()
          if [[ "$PRERELEASE" == true ]]; then args+=(--prerelease --latest=false); fi
          gh release create "$RELEASE_TAG" release-assets/* release-provenance.json \
            --verify-tag "${args[@]}" --notes-file RELEASE-NOTES.md \
            --title "PHPAML CLI ${RELEASE_TAG#v}"
