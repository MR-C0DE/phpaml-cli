name: Publish CLI release

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/publish-release.yml
  workflow_run:
    workflows:
      - Build macOS ARM64
      - Build Windows x64
      - Build Linux x64
    types:
      - completed

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-cli-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve the release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag="$(git tag --sort=-v:refname | head -n 1)"
          if [[ ! "$tag" =~ ^v[0-9] ]]; then
            echo "No version tag found." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download successful platform artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets artifact-zips

          for workflow in \
            "Build macOS ARM64" \
            "Build Windows x64" \
            "Build Linux x64"
          do
            run_id="$(gh api \
              --paginate \
              "/repos/${GITHUB_REPOSITORY}/actions/runs?event=push&branch=${RELEASE_TAG}&status=success&per_page=100" \
              --jq ".workflow_runs[] | select(.name == \"${workflow}\") | .id" \
              | head -n 1)"

            if [[ -z "$run_id" ]]; then
              echo "No successful run found for ${workflow} on ${RELEASE_TAG}." >&2
              exit 1
            fi

            gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" \
              --jq '.artifacts[] | select(.expired == false) | [.id, .name] | @tsv' \
              | while IFS=$'\t' read -r artifact_id artifact_name; do
                  gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
                    > "artifact-zips/${artifact_name}.zip"
                  unzip -q -o "artifact-zips/${artifact_name}.zip" -d release-assets
                done
          done

          test -n "$(find release-assets -maxdepth 1 -type f -print -quit)"

      - name: Verify checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          for checksum in *.sha256; do
            sha256sum --check "$checksum"
          done

      - name: Publish or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --verify-tag \
              --prerelease \
              --generate-notes \
              --title "PHPAML CLI ${RELEASE_TAG#v}"
          fi
