name: Build Linux x64

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false
      - name: Build autonomous AML packages
        run: ./scripts/build-linux-x64.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Test Debian installation
        run: |
          sudo dpkg -i dist/phpaml-*-linux-x64.deb
          env -i PATH=/usr/local/bin:/usr/bin:/bin HOME="$RUNNER_TEMP" aml version
          sudo dpkg -r phpaml
          test ! -e /usr/local/bin/aml
      - uses: actions/upload-artifact@v4
        with:
          name: aml-linux-x64
          path: |
            dist/aml-linux-x64.tar.gz
            dist/aml-linux-x64.tar.gz.sha256
            dist/phpaml-*-linux-x64.deb
            dist/phpaml-*-linux-x64.deb.sha256
