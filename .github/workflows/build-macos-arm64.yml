name: Build macOS ARM64

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      MACOS_APPLICATION_P12_BASE64:
        required: true
      MACOS_INSTALLER_P12_BASE64:
        required: true
      MACOS_P12_PASSWORD:
        required: true
      APPLE_ID:
        required: true
      APPLE_APP_SPECIFIC_PASSWORD:
        required: true
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check signing configuration
        env:
          MACOS_APPLICATION_P12_BASE64: ${{ secrets.MACOS_APPLICATION_P12_BASE64 }}
          MACOS_INSTALLER_P12_BASE64: ${{ secrets.MACOS_INSTALLER_P12_BASE64 }}
          MACOS_P12_PASSWORD: ${{ secrets.MACOS_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os
          required = ('MACOS_APPLICATION_P12_BASE64', 'MACOS_INSTALLER_P12_BASE64',
                      'MACOS_P12_PASSWORD', 'APPLE_ID', 'APPLE_APP_SPECIFIC_PASSWORD')
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit('Missing signing secrets: ' + ', '.join(missing))
          PY
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false
      - name: Build autonomous AML package
        run: ./scripts/build-macos-arm64.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Sign, notarize and verify the macOS distribution
        env:
          MACOS_APPLICATION_P12_BASE64: ${{ secrets.MACOS_APPLICATION_P12_BASE64 }}
          MACOS_INSTALLER_P12_BASE64: ${{ secrets.MACOS_INSTALLER_P12_BASE64 }}
          MACOS_P12_PASSWORD: ${{ secrets.MACOS_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          version="$(python3 -c 'import json; print(json.load(open("phpaml.json"))["version"])')"
          python3 scripts/macos-signing.py sign --directory dist --version "$version" --commit "$GITHUB_SHA"
      - name: Test installed macOS package
        run: |
          sudo installer -pkg dist/phpaml-*-macos-arm64.pkg -target /
          test -f /usr/local/lib/aml/runtime/bin/deploy.php
          test -f /usr/local/lib/aml/runtime/bin/console.php
          test -f /usr/local/lib/aml/runtime/bin/console-import-example.php
          /usr/local/lib/aml/runtime/php/bin/php tests/package-integrity.php /usr/local/lib/aml
          /usr/local/lib/aml/runtime/php/bin/php tests/console-package.php /usr/local/lib/aml /usr/local/bin/aml
          env -i PATH=/usr/local/bin:/usr/bin:/bin HOME="$RUNNER_TEMP" aml version
          env -i PATH=/usr/local/bin:/usr/bin:/bin HOME="$RUNNER_TEMP" aml doctor --offline
      - name: Verify checksums and extracted portable archive
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && shasum -a 256 --check aml-macos-arm64.tar.gz.sha256 phpaml-*-macos-arm64.pkg.sha256)
          extracted="$(mktemp -d "$RUNNER_TEMP/aml-macos-extracted.XXXXXX")"
          trap 'rm -rf "$extracted"' EXIT
          tar -xzf dist/aml-macos-arm64.tar.gz -C "$extracted"
          package="$extracted/aml-macos-arm64"
          env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP" "$package/bin/aml" version
          "$package/runtime/php/bin/php" tests/package-integrity.php "$package"
          "$package/runtime/php/bin/php" tests/console-package.php "$package"
      - uses: actions/upload-artifact@v4
        with:
          name: aml-macos-arm64
          path: |
            dist/aml-macos-arm64.tar.gz
            dist/aml-macos-arm64.tar.gz.sha256
            dist/phpaml-*-macos-arm64.pkg
            dist/phpaml-*-macos-arm64.pkg.sha256
            dist/macos-signing.json
          if-no-files-found: error
