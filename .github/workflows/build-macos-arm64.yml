name: Build macOS ARM64

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false
      - name: Build autonomous AML package
        run: ./scripts/build-macos-arm64.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: aml-macos-arm64
          path: |
            dist/aml-macos-arm64.tar.gz
            dist/aml-macos-arm64.tar.gz.sha256
